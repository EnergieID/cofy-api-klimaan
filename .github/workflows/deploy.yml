name: Deploy to Scaleway

on:
  push:
    branches: [main]

jobs:
  test-container:
    uses: ./.github/workflows/test-container.yml
  release:
    needs: test-container
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed to count tags

      - name: Generate CalVer version
        id: version
        run: |
          # Format: YYYY.MM.N  (N resets each month)
          PREFIX=$(date +'%Y.%m')
          
          # Count existing tags with this month's prefix
          COUNT=$(git tag --list "${PREFIX}.*" | wc -l | tr -d ' ')
          NEXT=$((COUNT + 1))
          
          VERSION="${PREFIX}.${NEXT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Generated version: ${VERSION}"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${VERSION}
          git push origin ${VERSION}

  build-and-deploy:
    needs: release
    runs-on: ubuntu-latest
    env:
      SCW_REGION: ${{ secrets.SCW_REGION }}
      REGISTRY: rg.${{ secrets.SCW_REGION }}.scw.cloud
      NAMESPACE: ${{ secrets.SCW_REGISTRY_NAMESPACE }}
      IMAGE_NAME: cofy-api-klimaan
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Log in to Scaleway Registry
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          echo "${SCW_SECRET_KEY}" | docker login \
            ${REGISTRY} -u nologin --password-stdin

      - name: Build and push image
        run: |
          IMAGE=${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}
          
          docker build \
            --build-arg VERSION=${VERSION} \
            -t ${IMAGE}:${VERSION} \
            -t ${IMAGE}:latest \
            .
          
          docker push ${IMAGE}:${VERSION}
          docker push ${IMAGE}:latest

      - name: Deploy container
        uses: scaleway/action-scw@v0
        with:
          # action inputs aren't run by a shell, so they can only use ${{ }} expressions
          args: container container update ${{ secrets.SCW_CONTAINER_ID }} image=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} region=${{ env.SCW_REGION }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          save-config: true
          version: v2.64.0  # pinned: CLI arguments change between releases

      # Only runs after a successful deploy, so the image we just rolled out is never at risk.
      - name: Clean up old images
        env:
          KEEP: 3  # current version + 2 previous to roll back to (latest is always kept)
        run: |
          NAMESPACE_ID=$(scw registry namespace list name=${NAMESPACE} region=${SCW_REGION} -o json | jq -r '.[0].id')
          IMAGE_ID=$(scw registry image list namespace-id=${NAMESPACE_ID} name=${IMAGE_NAME} region=${SCW_REGION} -o json | jq -r '.[0].id')

          scw registry tag list image-id=${IMAGE_ID} order-by=created_at_desc region=${SCW_REGION} -o json \
            | jq -r --argjson keep "${KEEP}" '[.[] | select(.name != "latest")] | .[$keep:] | .[] | "\(.id) \(.name)"' \
            | while read -r TAG_ID TAG_NAME; do
                echo "Deleting ${IMAGE_NAME}:${TAG_NAME}"
                scw registry tag delete ${TAG_ID} region=${SCW_REGION}
              done