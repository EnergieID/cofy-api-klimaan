[project]
name = "cofy-api-klimaan"
authors = [
    { name="EnergyID", email = "info@energieid.be" },
    # Add your name and email here if you want to be listed as an author
]
version = "0.1.0"
description = "Cofy API for Klimaan: solar directive based on Elia forecasts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cofy-api[directive]>=0.7.0",
    "httpx>=0.28.0",
    "polars>=1.38.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.69",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]
[tool.poe.tasks]
lint = "ruff check --fix"
format = "ruff format"
check = "ty check"
test = "pytest"
[tool.poe.tasks.dev]
cmd = "fastapi dev main.py"
envfile = ".env"
[tool.poe.tasks.prod]
shell = """
docker build -t cofy-api .
docker run -p 8080:8080 --env-file .env cofy-api
"""
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
]
ignore = [
    "E501", #Line too long
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
